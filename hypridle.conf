general {
    lock_cmd = pidof hyprlock || hyprlock --grace 10
}

listener {
    timeout = 180
    on-timeout = notify-send -u low -t 3000 "Idle" "System is going to lock screen in a few seconds..."
    on-resume = notify-send -u low -t 1500 "Idle" "Timer reset"
}

listener {
    timeout = 185
    on-timeout = loginctl lock-session
}
