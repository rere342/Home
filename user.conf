$HL_USERCON_SUPER = SUPER


### DEFAULT PROGRAMS
$HL_USERCON_TERMINAL     = kitty
$HL_USERCON_FILE_MANAGER = Thunar
$HL_USERCON_MENU_CONFIG  = -theme win11-custom
$HL_USERCON_MENU         = rofi -show combi $HL_USERCON_MENU_CONFIG


### WORKSPACES
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
workspace = w[1], name:Sex


### LOOK CUSTOMISATION
source = $HOME/.config/hypr/mocha.conf

$HL_USERCON_COL_ACTIVE   = $peach $red 45deg
$HL_USERCON_COL_INACTIVE = $overlay2 $surface1 45deg
